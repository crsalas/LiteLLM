services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.84.0@sha256:29252f25ed1b538d44f6b76ec97412c5537a180b39ede744b9f3e86ffdd278f5
    container_name: litellm-proxy
    user: "${LITELLM_UID:-1000}:${LITELLM_GID:-1000}"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    init: true
    restart: unless-stopped
